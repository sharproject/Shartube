supergraph:
  # The socket address and port to listen on
  listen: 0.0.0.0:2100
  path: /graphql
  introspection: true

homepage:
  enabled: true

include_subgraph_errors:
  all: true # Propagate errors from all subgraphs

headers:
  all: # Header rules for all subgraphs
    request:
      - propagate:
          matching: .*

plugins:
  experimental.expose_query_plan: true

cors:
  allow_credentials: true
  origins:
    - http://localhost:3000
    - https://studio.apollographql.com
    - https://shartube.vercel.app
    - https://shartube-***.vercel.app

limits:
  # Network-based limits
  http_max_request_bytes: 2000000 # Default value: 2 MB

  # Parser-based limits
  parser_max_tokens: 15000 # Default value
  parser_max_recursion: 500 # Default value

  # Operation-based limits (Enterprise only)
  max_depth: 100
  max_height: 200
  max_aliases: 30
  max_root_fields: 20